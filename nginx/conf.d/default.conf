# Minimal default backend served behind the Cloudflare Tunnel.
# Replace the content of ./nginx/html, or edit this file to proxy_pass to
# your real app container on the same Docker network, once you have one.

server {
    listen 8080;
    server_name _;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Used by the Docker Compose healthcheck — keep this path working.
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Example: once you have a real backend on the same Docker network,
    # replace the `location /` block above with something like:
    #
    # location / {
    #     proxy_pass http://app:3000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
